global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service', 'job']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  receiver: 'webhook-receiver'
  routes:
    - matchers:
        - severity = "critical"
      repeat_interval: 30m

inhibit_rules:
  # Inhibit warning alerts if a critical alert is firing on the same service
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['service']

receivers:
  - name: 'webhook-receiver'
    webhook_configs:
      - url: 'http://orderflow-alert-sink:8080/alerts'
        send_resolved: true
