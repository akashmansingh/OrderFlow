name: orderflow-prod

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-orderflow.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@orderflow.example.com}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      grafana:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  api:
    image: ghcr.io/${IMAGE_REPO:-theRiddler9/orderflow}-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDRESS: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-orderflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orderflow}?sslmode=disable
      DATABASE_TIMEOUT: 5
      RESERVATION_HOLD_SECONDS: 600
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_MINUTES: 15
      JWT_ISSUER: orderflow
      JWT_AUDIENCE: orderflow-api
      REDIS_ADDRESS: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TIMEOUT: 1
      RATE_LIMIT_LOGIN_PER_MINUTE: 10
      RATE_LIMIT_RESERVATION_PER_MINUTE: 30
      CACHE_SOLD_OUT_TTL: 5
      ORDERFLOW_CACHE_ENABLED: "true"
      ORDERFLOW_SOLDOUT_FASTPATH: "true"
      ORDERFLOW_RATE_LIMIT_ENABLED: "true"
      LOAD_TEST_MODE: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      ORDERFLOW_TRACING_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 384M

  worker:
    image: ghcr.io/${IMAGE_REPO:-theRiddler9/orderflow}-worker:${TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-orderflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orderflow}?sslmode=disable
      DATABASE_TIMEOUT: 5
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: reservation-events
      KAFKA_GROUP_ID: orderflow-workflow-worker
      WORKER_POLL_SECONDS: 1
      SIMULATED_PAYMENT_RESULT: approve
      REDIS_ADDRESS: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TIMEOUT: 1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      ORDERFLOW_TRACING_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 384M

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderflow}
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 768M

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 192M

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 256M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 96M

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_VIEWER:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN:-orderflow.example.com}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 256M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-orderflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orderflow}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  redpanda_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
