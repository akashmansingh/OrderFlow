name: orderflow

services:
  api:
    build:
      context: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDRESS: ${HTTP_ADDRESS:-:8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://orderflow:local-dev-password@postgres:5432/orderflow?sslmode=disable}
      DATABASE_TIMEOUT: ${DATABASE_TIMEOUT:-5}
      RESERVATION_HOLD_SECONDS: ${RESERVATION_HOLD_SECONDS:-600}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      JWT_ISSUER: ${JWT_ISSUER:-orderflow}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-orderflow-api}
      REDIS_ADDRESS: ${REDIS_ADDRESS:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-1}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-5}
      RATE_LIMIT_RESERVATION_PER_MINUTE: ${RATE_LIMIT_RESERVATION_PER_MINUTE:-10}
      CACHE_SOLD_OUT_TTL: ${CACHE_SOLD_OUT_TTL:-5}
      ORDERFLOW_CACHE_ENABLED: ${ORDERFLOW_CACHE_ENABLED:-true}
      ORDERFLOW_SOLDOUT_FASTPATH: ${ORDERFLOW_SOLDOUT_FASTPATH:-true}
      ORDERFLOW_RATE_LIMIT_ENABLED: ${ORDERFLOW_RATE_LIMIT_ENABLED:-true}
      LOAD_TEST_MODE: ${LOAD_TEST_MODE:-false}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"

  worker:
    build:
      context: .
      args:
        SERVICE: worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://orderflow:local-dev-password@postgres:5432/orderflow?sslmode=disable}
      DATABASE_TIMEOUT: ${DATABASE_TIMEOUT:-5}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-reservation-events}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-orderflow-workflow-worker}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
      SIMULATED_PAYMENT_RESULT: ${SIMULATED_PAYMENT_RESULT:-approve}
      REDIS_ADDRESS: ${REDIS_ADDRESS:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-1}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_started
      redis:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderflow}
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.17.1
    command:
      - -path=/migrations
      - -database=postgres://orderflow:local-dev-password@postgres:5432/orderflow?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro

  pgadmin:
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@orderflow.example}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-local-dev-password}
      PGADMIN_LISTEN_PORT: 5050
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    volumes:
      - redis-data:/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:9644:9644"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

volumes:
  pgadmin-data:
  postgres-data:
  redis-data:
