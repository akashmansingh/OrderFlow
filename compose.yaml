name: orderflow

services:
  api:
    build:
      context: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDRESS: ${HTTP_ADDRESS:-:8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://orderflow:local-dev-password@postgres:5432/orderflow?sslmode=disable}
      DATABASE_TIMEOUT: ${DATABASE_TIMEOUT:-5}
      RESERVATION_HOLD_SECONDS: ${RESERVATION_HOLD_SECONDS:-600}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-with-minimum-32-bytes-length-ok}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      JWT_ISSUER: ${JWT_ISSUER:-orderflow}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-orderflow-api}
      REDIS_ADDRESS: ${REDIS_ADDRESS:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-1}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-5}
      RATE_LIMIT_RESERVATION_PER_MINUTE: ${RATE_LIMIT_RESERVATION_PER_MINUTE:-10}
      CACHE_SOLD_OUT_TTL: ${CACHE_SOLD_OUT_TTL:-5}
      ORDERFLOW_CACHE_ENABLED: ${ORDERFLOW_CACHE_ENABLED:-true}
      ORDERFLOW_SOLDOUT_FASTPATH: ${ORDERFLOW_SOLDOUT_FASTPATH:-true}
      ORDERFLOW_RATE_LIMIT_ENABLED: ${ORDERFLOW_RATE_LIMIT_ENABLED:-true}
      LOAD_TEST_MODE: ${LOAD_TEST_MODE:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      ORDERFLOW_TRACING_ENABLED: ${ORDERFLOW_TRACING_ENABLED:-true}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      jaeger:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"

  worker:
    build:
      context: .
      args:
        SERVICE: worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://orderflow:local-dev-password@postgres:5432/orderflow?sslmode=disable}
      DATABASE_TIMEOUT: ${DATABASE_TIMEOUT:-5}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-reservation-events}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-orderflow-workflow-worker}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
      SIMULATED_PAYMENT_RESULT: ${SIMULATED_PAYMENT_RESULT:-approve}
      REDIS_ADDRESS: ${REDIS_ADDRESS:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-1}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      ORDERFLOW_TRACING_ENABLED: ${ORDERFLOW_TRACING_ENABLED:-true}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      jaeger:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_started
      redis:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderflow}
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.17.1
    command:
      - -path=/migrations
      - -database=postgres://orderflow:local-dev-password@postgres:5432/orderflow?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro

  pgadmin:
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@orderflow.example}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-local-dev-password}
      PGADMIN_LISTEN_PORT: 5050
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    volumes:
      - redis-data:/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 768M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:9644:9644"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://orderflow:local-dev-password@postgres:5432/orderflow?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M

volumes:
  pgadmin-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
