name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || {
            echo "Run gofmt on these files:"
            echo "$unformatted"
            exit 1
          }

      - name: Run static checks
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

      - name: Build API
        run: go build ./cmd/api

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate Prometheus rules and config with promtool
        run: |
          docker run --rm --entrypoint promtool -v "${PWD}/deploy/prometheus:/etc/prometheus" prom/prometheus:v2.54.1 check rules /etc/prometheus/recording_rules.yml /etc/prometheus/alerts.yml
          docker run --rm --entrypoint promtool -v "${PWD}/deploy/prometheus:/etc/prometheus" prom/prometheus:v2.54.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "${PWD}/deploy/prometheus:/etc/prometheus" -w /etc/prometheus prom/prometheus:v2.54.1 test rules test_alerts.yml

      - name: Lint Grafana Dashboards JSON
        shell: bash
        run: |
          for f in deploy/grafana/dashboards/*.json; do
            echo "Checking $f..."
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Build API container
        run: docker build --tag orderflow-api:ci .
