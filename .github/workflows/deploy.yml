name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Publish Images to GHCR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compute image tags
        id: vars
        run: |
          echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo }}-api:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.repo }}-api:latest

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: SERVICE=worker
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo }}-worker:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.repo }}-worker:latest

  deploy:
    name: Deploy to Production Cloud VM
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY secret is not configured; skipping SSH setup."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy with rollback safeguard
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY_HOST secret is not configured; skipping remote deployment."
            exit 0
          fi
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_PATH" "$IMAGE_TAG" <<'REMOTE'
              set -euo pipefail
              deploy_path="$1"
              image_tag="$2"
              cd "$deploy_path"

              # Capture current running image tag for rollback
              current_tag=$(docker compose -f deploy/compose.prod.yaml images -q api || true)

              echo "Deploying OrderFlow image tag: $image_tag"
              export TAG="$image_tag"
              docker compose -f deploy/compose.prod.yaml pull api worker
              docker compose -f deploy/compose.prod.yaml up -d --wait

              echo "Performing post-deploy smoke test..."
              if ! curl --fail --silent --show-error --retry 5 --retry-delay 2 http://127.0.0.1:8080/healthz; then
                echo "CRITICAL: Post-deploy smoke test failed! Initiating automated rollback..."
                if [ -n "$current_tag" ]; then
                  docker compose -f deploy/compose.prod.yaml rollback || docker compose -f deploy/compose.prod.yaml down
                fi
                exit 1
              fi

              echo "Deployment succeeded and smoke check passed."
          REMOTE
